<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>交友関係ランキング (Safe)</title>

<!-- OGP / X -->
<meta property="og:title" content="交友関係ランキング作成ツール">
<meta property="og:description" content="Twitterのやりとりをランキング表示。ログイン不要・保存なし。">
<meta property="og:image" content="https://allegrostars.github.io/interaction-map/og.png">
<meta property="og:url" content="https://allegrostars.github.io/interaction-map/">
<meta name="twitter:card" content="summary_large_image">

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body {
  background:#eef2f5;
  font-family: system-ui, -apple-system, sans-serif;
  margin:0;
}

h2 {
  text-align:center;
  margin:20px 0;
}

#list {
  max-width:420px;
  margin:0 auto;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
}

.row {
  display:flex;
  align-items:center;
  padding:12px;
  border-bottom:1px solid #eee;
}

.row:last-child { border-bottom:none; }

.icon {
  width:40px;
  height:40px;
  border-radius:50%;
  background:#ccc;
  margin-right:12px;
}

.name {
  flex:1;
  font-size:14px;
}

.count {
  font-weight:bold;
}

button {
  display:block;
  margin:20px auto;
  padding:10px 16px;
}

footer {
  text-align:center;
  font-size:12px;
  opacity:.7;
  margin-bottom:30px;
}
</style>
</head>

<body>

<h2>Interaction Ranking</h2>

<div id="list"></div>

<button id="shareBtn">📤 Xで共有する</button>

<footer>
🔒💾 使用したデータは保存されません
</footer>

<script>
(() => {
  const list = document.getElementById("list");

  // ダミーデータ（後で差し替え可能）
  const users = Array.from({ length: 20 }, (_, i) => ({
    name: `User_${i + 1}`,
    count: Math.floor(Math.random() * 150) + 10
  })).sort((a, b) => b.count - a.count);

  users.forEach(u => {
    const row = document.createElement("div");
    row.className = "row";

    row.innerHTML = `
      <div class="icon"></div>
      <div class="name">${u.name}</div>
      <div class="count">${u.count}</div>
    `;

    list.appendChild(row);
  });

  document.getElementById("shareBtn").addEventListener("click", () => {
    const text = encodeURIComponent(
`最近のやりとりをランキング化してみた！

#交友関係マップ作成ツール
https://allegrostars.github.io/interaction-map/`
    );

    window.open(
      `https://twitter.com/intent/tweet?text=${text}`,
      "_blank"
    );

    html2canvas(list).then(canvas => {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "interaction-ranking.png";
      a.click();
    });
  });
})();
</script>

</body>
</html>
